# Logging level for the package
log4j.rootLogger=ERROR, rollingFileAppender
log4j.logger.${log.packages}=${log.level}, rollingFileAppender

# RollingFile appender setup
log4j.appender.rollingFileAppender=org.apache.log4j.RollingFileAppender
log4j.appender.rollingFileAppender.MaxFileSize=10MB
log4j.appender.rollingFileAppender.MaxBackupIndex=5
log4j.appender.rollingFileAppender.Append=false
log4j.appender.rollingFileAppender.encoding=UTF-8

# PatternLayout setup
log4j.appender.rollingFileAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.rollingFileAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss Z} [%p] %c{1}.%M - %m%n%n
log4j.appender.rollingFileAppender.File=${log.path}

# To prevent duplication of data in the parent logger (rootLogger)
log4j.additivity.${log.packages}=false
